name: CI

on:
  push:
    branches: [main, develop, "release/*"]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-check:
    name: Engine Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Format Check
        run: cargo fmt --check

      - name: Clippy Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Tests
        run: cargo test --workspace --verbose

  frontend-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Dependencies
        working-directory: apps/desktop
        run: pnpm install

      - name: Typecheck
        working-directory: apps/desktop
        run: pnpm typecheck

      - name: Build UI
        working-directory: apps/desktop
        run: pnpm build

  appimage-build:
    name: Build Linux AppImage & Release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [engine-check, frontend-check]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Frontend Dependencies
        working-directory: apps/desktop
        run: pnpm install

      - name: Build Tauri App & AppImage
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: "Orveth v__VERSION__"
          releaseBody: "Automated release build of Orveth Linux AppImage."
          releaseDraft: false
          prerelease: false

      - name: Generate SHA-256 Checksums
        if: always()
        run: |
          mkdir -p dist-release
          find apps/desktop/src-tauri/target/release/bundle/appimage/ -name "*.AppImage" -exec cp {} dist-release/ \; 2>/dev/null || true
          cd dist-release
          if ls *.AppImage 1> /dev/null 2>&1; then
            sha256sum *.AppImage > SHA256SUMS.txt
            cat SHA256SUMS.txt
          fi

      - name: Upload SHA-256 to GitHub Release
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f dist-release/SHA256SUMS.txt ]; then
            TAG="v$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
            gh release upload "$TAG" dist-release/SHA256SUMS.txt --clobber || echo "Release upload skipped"
          fi

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Orveth-Linux-AppImage
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            dist-release/SHA256SUMS.txt
          if-no-files-found: warn
